name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest

      - name: Scenarios are up to date
        run: |
          python -m evals.build_scenarios
          git diff --exit-code evals/scenarios.json

      - name: Oracle self-check (reference trajectories, normal + faults)
        run: make oracle PYTHON=python

      - name: Upload oracle results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-results
          path: results/oracle*/
